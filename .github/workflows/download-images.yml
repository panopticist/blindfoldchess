name: Download images from Squarespace

# This workflow rescues every image from Squarespace's servers and saves
# copies directly into this repository, so the site keeps working after
# the Squarespace subscription is cancelled.
#
# It runs automatically on the first push, and you can also run it by hand:
# repo page on github.com -> Actions tab -> "Download images from Squarespace"
# -> Run workflow. It skips files that already exist, so re-running is safe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download images listed in image-manifest.txt
        run: |
          set -u
          failures=0
          while read -r url path; do
            # skip blank lines and comments
            [ -z "${url:-}" ] && continue
            case "$url" in \#*) continue ;; esac
            if [ -f "$path" ]; then
              echo "exists, skipping: $path"
              continue
            fi
            mkdir -p "$(dirname "$path")"
            echo "downloading: $url -> $path"
            if ! curl -fsSL -A "Mozilla/5.0" --retry 3 "$url" -o "$path"; then
              echo "::warning::FAILED to download $url"
              failures=$((failures+1))
              rm -f "$path"
            fi
          done < image-manifest.txt
          echo "Done. Failures: $failures"

      - name: Commit downloaded files to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add images downloaded from Squarespace CDN"
            git push
          fi
