---
layout: default
---
<article class="post">
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.author %} · {{ page.author }}{% endif %}
  </p>
  {{ content }}
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Back to the Blog</a></p>
</article>
